name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build (debug)
        run: swift build

      - name: Test
        # Tests that need a local Ollama server are skipped on CI
        run: swift test

      - name: Build app (release)
        run: ./scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --keepParent build/Callbot.app build/Callbot.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Callbot-app
          path: build/Callbot.zip
